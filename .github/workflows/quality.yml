name: Quality

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck and build
        run: npm run build

      - name: Verify Commander Entorno
        env:
          ENTORNO_QA_DIR: ${{ runner.temp }}/entorno-qa
        run: npm run check:entorno
      - name: Save office rendering checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entorno-qa
          path: ${{ runner.temp }}/entorno-qa
          if-no-files-found: ignore
          retention-days: 5
